<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cash Register</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <!-- Inventory Column -->
        <div class="column inventory-col">
            <h2>Inventory</h2>
            <div id="inventory-list">
                <!-- Populated by JS -->
            </div>
            <div class="help-section">
                <h4>Examples:</h4>
                <code>add 2 coca cola zero</code>
                <code>remove 1 milk</code>
                <code>checkout $50</code>
                <code>/clear</code>
            </div>
        </div>

        <!-- Chat Column -->
        <div class="column chat-col">
            <h2>Chat</h2>
            <div class="session-info">
                Session: <code id="session-display">loading...</code>
            </div>
            <div id="chat-history" class="chat-history">
                <!-- Messages go here -->
            </div>
            <div class="chat-input-container">
                <input type="text" id="message-input" placeholder="Type your request..." autofocus>
                <button id="send-btn" title="Send message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <!-- Loading Spinner -->
            <div id="loading-spinner" class="loading-spinner hidden">
                <div class="spinner"></div>
                <span>Processing...</span>
            </div>
        </div>

        <!-- Cart Column -->
        <div class="column cart-col">
            <h2>Cart</h2>
            <div id="cart-list">
                <!-- Populated by JS -->
            </div>
            <div class="cart-total">
                <h3>Total Due: <span id="total-due">$0.00</span></h3>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
