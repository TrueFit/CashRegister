version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cashregister-postgres
    environment:
      POSTGRES_USER: cashregister_user
      POSTGRES_PASSWORD: cashregister_pass
      POSTGRES_DB: cashregister_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashregister_user -d cashregister_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-ddd-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Cash Register System
      - APP_VERSION=1.0.0
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://cashregister_user:cashregister_pass@db:5432/cashregister_db
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=cashregister_db
      - DATABASE_USER=cashregister_user
      - DATABASE_PASSWORD=cashregister_pass
    volumes:
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Redis Cache (optional - for future use)
  # redis:
  #   image: redis:7-alpine
  #   container_name: fastapi-redis
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - app-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
